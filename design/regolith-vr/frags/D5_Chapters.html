<!-- title: Chapters, and marking a moment | 1600,900 -->
<div class="fov">
<div class="scr a5" style="left:80px;top:50px;width:640px;height:360px"></div>
<div class="p lift" style="left:80px;top:440px;width:640px;height:420px;padding:28px">
<div class="col g18">
<div class="fx g18 ac">
<span class="art a5" style="width:144px;height:81px;border-radius:10px"></span>
<div class="col g4 grow"><h2 class="h2">Name this moment</h2><p class="m">Paused at 52:40</p></div>
<div class="fx g4"><button class="chip">−5 s</button><button class="chip">−1 s</button><button class="chip">+1 s</button><button class="chip">+5 s</button></div>
</div>
<div class="fx g12 ac">
<div class="fld on grow"><label class="fl" for="n">Name</label><input id="n" value="Storm" style="background:none;border:0;color:#fff;font:600 19px/1 'Space Grotesk',sans-serif;padding:0;outline:0"></div>
<button class="ic flat" aria-label="Say the name" style="width:72px;height:72px">[[mic]]</button>
</div>
<div class="col g8"><p class="eb">Names you already use</p>
<div class="fx g8 wrap"><button class="chip">Arrival</button><button class="chip">Cannonball</button><button class="chip">Rope swing</button><button class="chip on">Storm</button><button class="chip">Sunset</button><button class="chip">The view</button></div></div>
<div class="fx jb ac"><p class="m">Saved beside the video on the share, so your phone sees it too.</p><div class="fx g12"><button class="btn frost sm">Cancel</button><a class="btn red sm" href="D2_Bar.dc.html">Save</a></div></div>
</div>
</div>
<div class="p" style="left:760px;top:50px;width:760px;height:810px;padding:30px">
<div class="col g18">
<div class="fx jb ac"><h1 class="h1">Chapters</h1><div class="fx g12"><button class="btn frost sm">[[pencil.s]]Edit</button><a class="ic flat" href="D2_Bar.dc.html" aria-label="Close">[[x]]</a></div></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
<button class="tile"><span class="art a7" style="aspect-ratio:16/9"></span><span class="chip dash" style="height:34px;font-size:14px;color:#A0A0A0;align-self:flex-start">Part 1</span><span class="m">0:00</span></button>
<button class="tile"><span class="art a3" style="aspect-ratio:16/9"></span><span class="t">The greenhouse</span><span class="m">17:20</span></button>
<button class="tile"><span class="art a1" style="aspect-ratio:16/9"></span><span class="chip dash" style="height:34px;font-size:14px;color:#A0A0A0;align-self:flex-start">Part 3</span><span class="m">38:05</span></button>
<button class="tile"><span class="art a5" style="aspect-ratio:16/9;outline:2px solid #E11B17;outline-offset:3px"></span><span class="t">Storm</span><span class="m">52:40 · new</span></button>
<button class="tile"><span class="art a6" style="aspect-ratio:16/9"></span><span class="chip dash" style="height:34px;font-size:14px;color:#A0A0A0;align-self:flex-start">Part 5</span><span class="m">1:16:30</span></button>
<button class="tile"><span class="art a2" style="aspect-ratio:16/9"></span><span class="chip dash" style="height:34px;font-size:14px;color:#A0A0A0;align-self:flex-start">Part 6</span><span class="m">1:36:48</span></button>
<button class="tile"><span class="art a8" style="aspect-ratio:16/9"></span><span class="chip dash" style="height:34px;font-size:14px;color:#A0A0A0;align-self:flex-start">Part 7</span><span class="m">1:52:10</span></button>
</div>
<p class="m">Tap a dashed part to name it. Select any chapter to play from there.</p>
</div>
</div>
</div>

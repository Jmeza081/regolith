<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["dusk","city","snow","party","forest","pool"],"default":"dusk"},"p":{"editor":"range","min":0,"max":1,"step":0.01,"default":0.4},"w":{"editor":"int","default":416},"h":{"editor":"int","default":740},"uid":{"editor":null,"default":"solo"},"$preview":{"width":416,"height":740}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'dusk';
    const p = Math.max(0, Math.min(1, Number(this.props.p ?? 0.4)));
    const w = Number(this.props.w ?? 416);
    const h = Number(this.props.h ?? 740);
    const uid = String(this.props.uid ?? 'solo');
    const x = 40 + p * 336;
    const id = (n) => 'sc-' + uid + '-' + n;
    return {
      w: w,
      h: h,
      dusk: kind === 'dusk',
      city: kind === 'city',
      snow: kind === 'snow',
      party: kind === 'party',
      forest: kind === 'forest',
      pool: kind === 'pool',
      walk: 'translate(' + x.toFixed(1) + ' 0)',
      sunY: (428 + p * 38).toFixed(1),
      fall: 'translate(0 ' + (p * 140).toFixed(1) + ')',
      bob: 'translate(' + (70 + p * 276).toFixed(1) + ' ' + (560 + Math.sin(p * Math.PI * 3) * 14).toFixed(1) + ')',
      g1: id('a'),
      g2: id('b'),
      u1: 'url(#' + id('a') + ')',
      u2: 'url(#' + id('b') + ')',
    };
  }
}
</script>

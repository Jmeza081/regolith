<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --ground:#0A0A0A; --surface:#0F0F0F; --hairline:#1F1F1F; --raised:#2E2E2E;
      --metadata:#6E6E6E; --body:#A0A0A0; --ink:#FFFFFF; --inkSoft:#EDEDED;
      --red:#E11B17; --badge:#1A1A1A; --notice:#141414;
      --frost:rgba(255,255,255,.06); --frostBorder:rgba(255,255,255,.18);
    }
    body{margin:0;background:var(--ground);font-family:"Space Grotesk","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:#E11B17;} a:hover{color:#EDEDED;}
    .mich{font-family:Michroma,Verdana,sans-serif;text-transform:uppercase;font-weight:400;}
    .screen{width:411px;height:914px;position:relative;overflow:hidden;background:var(--ground);}
    .col{display:flex;flex-direction:column;}
    .row{display:flex;flex-direction:row;align-items:center;}
    .card{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;}
    .eyebrow{font-size:14.1px;line-height:14.1px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--metadata);}
    .meta{font-size:14.1px;line-height:19.7px;color:var(--metadata);}
    .rowLabel{font-size:19.2px;line-height:24.3px;font-weight:500;color:var(--ink);}
    .rowLabelSm{font-size:16.6px;line-height:21.8px;font-weight:500;color:var(--ink);}
    .notice{font-size:16.6px;line-height:24.3px;font-weight:500;color:var(--inkSoft);}
    .thumb{width:66.6px;height:37.4px;border-radius:7px;background:linear-gradient(140deg,#243040,#121820);flex:none;}
    .snack{background:var(--surface);border:1px solid var(--raised);border-radius:14px;padding:12px 18px;min-height:56px;}
    .snackText{font-size:19.2px;line-height:24.3px;font-weight:500;color:var(--ink);}
    .undo{height:44px;display:flex;align-items:center;padding:0 12px;font-size:17.9px;font-weight:600;color:var(--ink);}
    .navpill{position:absolute;left:18px;right:18px;bottom:26px;height:62px;border-radius:999px;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;}
    .navcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
    .navlabel{font-size:12.8px;line-height:12.8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
    .ghost{position:absolute;left:18px;right:18px;bottom:26px;height:62px;border-radius:999px;border:1px dashed rgba(225,27,23,.55);}
    .ghostLabel{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(225,27,23,.8);}
    .tag{display:inline-block;font-size:12.8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;}
  </style>
</helmet>

<div class="screen">
  <div class="row" style="padding:32px 8px 8px 18px;align-items:flex-start;">
    <div class="col" style="flex:1;gap:8px;">
      <div class="mich" style="font-size:19.2px;line-height:25px;color:var(--ink);">Films</div>
      <div style="font-size:15.4px;line-height:15.4px;color:var(--metadata);">media / Films</div>
    </div>
    <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;">
      <svg width="24.3" height="24.3" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>
    </div>
  </div>
  <div class="col" style="padding:0 18px;gap:12px;margin-top:12px;">
    <div class="col" style="gap:8px;">
      <div class="eyebrow">4 files</div>
      <div class="card" style="padding:0 12px;">
        <div class="row" style="min-height:72px;gap:12px;">
          <div class="thumb"></div>
          <div class="col" style="flex:1;gap:2px;"><div class="rowLabelSm">Heat.1995.1080p.mkv</div><div class="meta">1080p · 6.1 GB</div></div>
        </div>
        <div style="height:1px;background:var(--hairline);"></div>
        <div class="row" style="min-height:72px;gap:12px;">
          <div class="thumb"></div>
          <div class="col" style="flex:1;gap:2px;"><div class="rowLabelSm">Hard.Boiled.1992.mkv</div><div class="meta">1080p · 2.8 GB</div></div>
        </div>
        <div style="height:1px;background:var(--hairline);"></div>
        <div class="row" style="min-height:72px;gap:12px;">
          <div class="thumb"></div>
          <div class="col" style="flex:1;gap:2px;"><div class="rowLabelSm">Long.Test.2026.mp4</div><div class="meta">4K · 31.2 MB</div></div>
        </div>
        <div style="height:1px;background:var(--hairline);"></div>
        <div class="row" style="min-height:72px;gap:12px;">
          <div class="thumb"></div>
          <div class="col" style="flex:1;gap:2px;"><div class="rowLabelSm">Sicario.2015.2160p.mkv</div><div class="meta">4K · 18.4 GB</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- t = 4s: the snackbar is still up, the pill left at t = 3s -->
  <div class="row snack" style="position:absolute;left:18px;right:18px;bottom:96px;gap:12px;">
    <div style="flex:1;" class="snackText">Moved 4 videos to Archive</div>
    <div class="undo">Undo</div>
  </div>

  <div class="ghost"><div class="ghostLabel">112dp reserved · pill gone</div></div>

  <div class="col" style="position:absolute;left:18px;right:18px;bottom:112px;top:auto;"></div>
</div>
</x-dc>
</body>
</html>

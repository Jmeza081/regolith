<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --ground:#0A0A0A; --surface:#0F0F0F; --hairline:#1F1F1F; --raised:#2E2E2E;
      --metadata:#6E6E6E; --body:#A0A0A0; --ink:#FFFFFF; --inkSoft:#EDEDED;
      --red:#E11B17; --badge:#1A1A1A; --disabledBg:#161616; --disabledInk:#4A4A4A;
      --notice:#141414; --frost:rgba(255,255,255,.06); --frostBorder:rgba(255,255,255,.18);
    }
    body{margin:0;background:var(--ground);font-family:"Space Grotesk","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:#E11B17;} a:hover{color:#EDEDED;}
    .mich{font-family:Michroma,Verdana,sans-serif;text-transform:uppercase;font-weight:400;}
    .screen{width:411px;height:914px;position:relative;overflow:hidden;background:var(--ground);}
    .col{display:flex;flex-direction:column;}
    .row{display:flex;flex-direction:row;align-items:center;}
    .card{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;}
    .eyebrow{font-size:14.1px;line-height:14.1px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--metadata);}
    .meta{font-size:14.1px;line-height:19.7px;color:var(--metadata);}
    .meta12{font-size:15.4px;line-height:15.4px;color:var(--metadata);}
    .bodyTxt{font-size:17.9px;line-height:26.9px;color:var(--body);}
    .rowLabel{font-size:19.2px;line-height:24.3px;font-weight:500;color:var(--ink);}
    .rowLabelSm{font-size:16.6px;line-height:21.8px;font-weight:500;color:var(--ink);}
    .notice{font-size:16.6px;line-height:24.3px;font-weight:500;color:var(--inkSoft);}
    .thumb{width:66.6px;height:37.4px;border-radius:7px;background:linear-gradient(140deg,#243040,#121820);flex:none;}
    .pickbox{width:48.6px;height:48.6px;border-radius:10px;background:var(--disabledBg);display:flex;align-items:center;justify-content:center;flex:none;}
    .pickbox.on{background:var(--ink);}
    .dialog{background:var(--surface);border:1px solid var(--raised);border-radius:20px;padding:18px;}
    .dlgTitle{font-size:19.2px;line-height:26.9px;color:var(--ink);}
    .btnPrimary{height:61px;border-radius:999px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:19.2px;font-weight:700;color:#fff;}
    .btnSecondary{height:61px;border-radius:999px;background:var(--frost);border:1px solid var(--frostBorder);display:flex;align-items:center;justify-content:center;font-size:19.2px;font-weight:600;color:var(--inkSoft);}
    .btnDestructive{height:61px;border-radius:999px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:17.9px;font-weight:600;color:#fff;}
    .pillAction{height:53.8px;border-radius:999px;background:var(--frost);border:1px solid var(--frostBorder);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16.6px;font-weight:600;color:var(--inkSoft);flex:1;}
    .pillAction.off{background:var(--disabledBg);border-color:transparent;color:var(--disabledInk);}
    .navpill{position:absolute;left:18px;right:18px;bottom:26px;height:62px;border-radius:999px;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;}
    .navcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
    .navlabel{font-size:12.8px;line-height:12.8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  </style>
</helmet>
<div class="screen">
  <!-- Browse behind, dimmed -->
  <div style="position:absolute;inset:0;">
    <div class="row" style="padding:36px 8px 18px 18px;">
      <div class="mich" style="flex:1;font-size:19.2px;line-height:25px;color:var(--ink);">4 selected</div>
      <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;"><svg width="24.3" height="24.3" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></div>
      <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;"><svg width="24.3" height="24.3" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
    </div>
    <div class="col" style="padding:0 18px;gap:12px;">
      <div class="col" style="gap:8px;"><div class="eyebrow">2 folders</div><div class="card" style="height:147px;"></div></div>
      <div class="col" style="gap:8px;"><div class="eyebrow">5 files</div><div class="card" style="height:366px;"></div></div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.72);"></div>

  <div style="position:absolute;inset:0;display:flex;align-items:center;padding:18px;">
    <div class="dialog col" style="gap:12px;width:100%;">
      <div class="mich dlgTitle">Delete 4 videos?</div>
      <div class="bodyTxt">25.2&nbsp;GB leaves media for good. This can't be undone, and the chapters you wrote and where you left off go with them.</div>
      <div class="col" style="gap:4px;">
        <div class="meta">Arrival.2016.1080p.mkv</div>
        <div class="meta">Hard.Boiled.1992.mkv</div>
        <div class="meta">Long.Test.2026.mp4</div>
        <div class="meta">Sicario.2015.2160p.mkv</div>
      </div>
      <div class="col" style="gap:8px;">
        <div class="btnDestructive">Delete 4 videos</div>
        <div class="btnSecondary">Keep them</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

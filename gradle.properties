# Gradle daemon memory. Kotlin + Compose compilation is hungry; 4 GB avoids
# out-of-memory failures on a full rebuild.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# This machine has no system JDK on PATH; Android Studio bundles one. Gradle is
# pointed at it here so `./gradlew` works from a plain terminal and from argent.
# Override per machine in local.properties or with JAVA_HOME if yours differs.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

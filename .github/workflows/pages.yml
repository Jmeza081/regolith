# The product page (site/) on GitHub Pages, as murmur-keyboard publishes its
# own: a push to main that touches site/ deploys the folder as it is. No build
# step; the page is one HTML file with its images beside it. The release
# workflow ignores site/, so a page change never publishes an APK.
#
# Needs Settings › Pages › Build and deployment › Source set to
# "GitHub Actions" once, by the repository's owner.
name: Product page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

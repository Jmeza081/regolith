# Every push and every pull request, except pushes to main — those go through
# release.yml, which runs the same checks before it publishes anything, and
# running both would build the same commit twice.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per branch: a second push makes the first one's answer stale.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21, to match the Android Studio JBR that builds this locally —
          # AGP 9.4 accepts 17, but a runner on a different JDK than the
          # machine the code is written on is a class of failure nobody needs.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # -Dorg.gradle.java.home overrides the one committed in
      # gradle.properties, which points at the Android Studio JBR on the
      # owner's Mac and does not exist on a Linux runner. It is set per
      # invocation rather than edited out of gradle.properties, because that
      # file is what makes `./gradlew` work in a plain terminal there.
      - name: Test, lint and build
        run: ./gradlew test lint assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      # Only when something failed: the reports say WHICH assertion, which the
      # log's one-line summary does not.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

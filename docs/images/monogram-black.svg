<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 30 44 48" width="88" height="96">
  <title>Regolith</title>
  <!-- The Strata Wedge, as the launcher icon draws it (res/drawable/ic_launcher_foreground.xml),
       in black with no tile: solid bands, and the second and fourth at 62%. -->
  <defs>
    <clipPath id="wedge"><path d="M36,30 L80,54 L36,78 Q46,54 36,30 Z"/></clipPath>
  </defs>
  <g clip-path="url(#wedge)" fill="#000000">
    <rect x="0" y="28" width="108" height="9"/>
    <rect x="0" y="40.5" width="108" height="7" fill-opacity="0.62"/>
    <rect x="0" y="50.5" width="108" height="9"/>
    <rect x="0" y="63" width="108" height="6.5" fill-opacity="0.62"/>
    <rect x="0" y="72.5" width="108" height="7.5"/>
  </g>
</svg>
